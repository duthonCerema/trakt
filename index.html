<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trakt List Matcher PKCE</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #ed1c24;
      --accent-hover: #b81419;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.8rem;
    }

    .status-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 1rem;
      box-sizing: border-box;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #333333;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #444444;
    }

    .btn-success {
      background: #2e7d32 !important;
      cursor: default;
    }

    .movie-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      margin-top: 12px;
      padding: 14px 18px;
      border-radius: 6px;
      gap: 16px;
    }

    .movie-info {
      flex-grow: 1;
    }

    .movie-title {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .query-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <h1>Trakt List Matcher</h1>

  <div class="status-bar">
    <span id="status-text">Initialisation...</span>
    <button id="auth-btn" style="display:none;"></button>
  </div>

  <div id="app-section" style="display:none;">
    <h3>1. Coller la liste de films (un film par ligne)</h3>
    <textarea id="raw-list" placeholder="Inception&#10;Le fabuleux destin d amelie poulain&#10;Toy Story 3"></textarea>
    <br><br>
    <button id="process-btn">Rechercher les correspondances</button>

    <h3 style="margin-top: 32px;">2. Valider et ajouter aux listes</h3>
    <div id="results"></div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURATION : Renseigne ton Client ID et les slugs de tes 3 listes ici
    // =========================================================================
    const TRAKT_CLIENT_ID = 'THw7wcXY0MTrPjxJtDPxHtjxnyPptVcz5Eiwg3OfmNM';
    const LIST_1_SLUG     = 'pierre';
    const LIST_2_SLUG     = 'maeva';
    const LIST_3_SLUG     = 'enfants';

    // Label affiché sur les boutons (personnalisable)
    const LIST_1_LABEL    = 'Pierre';
    const LIST_2_LABEL    = 'Maëva';
    const LIST_3_LABEL    = 'Enfants';
    // =========================================================================

    const REDIRECT_URI = window.location.href.split('?')[0].split('#')[0];

    // Outillage Crypto pour le flux OAuth2 PKCE
    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return Array.from(values).map(x => possible[x % possible.length]).join('');
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return crypto.subtle.digest('SHA-256', data);
    }

    function base64urlencode(a) {
      return btoa(String.fromCharCode.apply(null, new Uint8Array(a)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function generateCodeChallenge(verifier) {
      const hashed = await sha256(verifier);
      return base64urlencode(hashed);
    }

    // Gestion de l'authentification OAuth2 PKCE
    async function initAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const token = localStorage.getItem('trakt_token');
      const statusText = document.getElementById('status-text');
      const authBtn = document.getElementById('auth-btn');

      if (code) {
        statusText.innerText = "Validation du code d'autorisation Trakt...";
        const verifier = localStorage.getItem('pkce_verifier');

        try {
          const response = await fetch('https://api.trakt.tv/oauth/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              code: code,
              client_id: TRAKT_CLIENT_ID,
              redirect_uri: REDIRECT_URI,
              grant_type: 'authorization_code',
              code_verifier: verifier
            })
          });

          if (response.ok) {
            const data = await response.json();
            localStorage.setItem('trakt_token', data.access_token);
            window.history.replaceState({}, document.title, REDIRECT_URI);
            showApp();
          } else {
            statusText.innerText = "Erreur lors de la récupération du token.";
            showLoginButton();
          }
        } catch (err) {
          statusText.innerText = "Erreur de connexion à l'API Trakt.";
          showLoginButton();
        }
      } else if (token) {
        showApp();
      } else {
        statusText.innerText = "Non connecté à Trakt.";
        showLoginButton();
      }
    }

    function showLoginButton() {
      const authBtn = document.getElementById('auth-btn');
      authBtn.innerText = "Se connecter avec Trakt";
      authBtn.style.display = "inline-block";
      authBtn.onclick = async () => {
        const verifier = generateRandomString(64);
        localStorage.setItem('pkce_verifier', verifier);
        const challenge = await generateCodeChallenge(verifier);

        const authUrl = `https://trakt.tv/oauth/authorize?response_type=code&client_id=${TRAKT_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&code_challenge=${challenge}&code_challenge_method=S256`;
        window.location.href = authUrl;
      };
    }

    function showApp() {
      document.getElementById('status-text').innerText = "Connecté à Trakt";
      
      const authBtn = document.getElementById('auth-btn');
      authBtn.innerText = "Déconnexion";
      authBtn.className = "btn-secondary";
      authBtn.style.display = "inline-block";
      authBtn.onclick = () => {
        localStorage.removeItem('trakt_token');
        localStorage.removeItem('pkce_verifier');
        window.location.reload();
      };

      document.getElementById('app-section').style.display = 'block';
    }

    // Traitement de la liste
    document.getElementById('process-btn').onclick = async () => {
      const lines = document.getElementById('raw-list').value.split('\n').filter(l => l.trim() !== '');
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      if (lines.length === 0) {
        alert("Veuillez saisir au moins un nom de film.");
        return;
      }

      for (const line of lines) {
        const movie = await searchMovie(line.trim());
        renderMovieCard(line, movie);
      }
    };

    async function searchMovie(query) {
      try {
        const res = await fetch(`https://api.trakt.tv/search/movie?query=${encodeURIComponent(query)}`, {
          headers: {
            'Content-Type': 'application/json',
            'trakt-api-version': '2',
            'trakt-api-key': TRAKT_CLIENT_ID
          }
        });
        const data = await res.json();
        return data.length > 0 ? data[0].movie : null;
      } catch (e) {
        return null;
      }
    }

    function renderMovieCard(originalQuery, match) {
      const div = document.createElement('div');
      div.className = 'movie-card';

      if (!match) {
        div.innerHTML = `
          <div class="movie-info">
            <div class="movie-title">"${originalQuery}"</div>
            <div class="query-tag" style="color:#ff6b6b;">Aucune correspondance trouvée sur Trakt</div>
          </div>
          <div class="actions">
            <button class="btn-secondary" onclick="this.closest('.movie-card').remove()">Passer</button>
          </div>
        `;
      } else {
        div.innerHTML = `
          <div class="movie-info">
            <div class="movie-title">${match.title} <span style="color:var(--text-muted); font-weight:normal;">(${match.year || 'N/A'})</span></div>
            <div class="query-tag">Recherche originale : "${originalQuery}"</div>
          </div>
          <div class="actions">
            <button onclick="addToList('${match.ids.trakt}', '${LIST_1_SLUG}', this)">${LIST_1_LABEL}</button>
            <button onclick="addToList('${match.ids.trakt}', '${LIST_2_SLUG}', this)">${LIST_2_LABEL}</button>
            <button onclick="addToList('${match.ids.trakt}', '${LIST_3_SLUG}', this)">${LIST_3_LABEL}</button>
            <button class="btn-secondary" onclick="this.closest('.movie-card').remove()">Non exact</button>
          </div>
        `;
      }
      document.getElementById('results').appendChild(div);
    }

    async function addToList(traktId, listSlug, btnElement) {
      const token = localStorage.getItem('trakt_token');
      
      try {
        const res = await fetch(`https://api.trakt.tv/users/me/lists/${listSlug}/items`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
            'trakt-api-version': '2',
            'trakt-api-key': TRAKT_CLIENT_ID
          },
          body: JSON.stringify({
            movies: [{ ids: { trakt: parseInt(traktId, 10) } }]
          })
        });

        if (res.ok) {
          btnElement.className = 'btn-success';
          btnElement.innerText = 'Ajouté !';
          btnElement.onclick = null;
        } else {
          alert(`Erreur d'ajout. Vérifiez que la liste "${listSlug}" existe bien sur votre compte Trakt.`);
        }
      } catch (err) {
        alert("Erreur réseau lors de la communication avec Trakt.");
      }
    }

    initAuth();
  </script>
</body>
</html>
